<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Mourinho | Соцсети</title>
    <meta property="og:title" content="Jose Mourinho | Соцсети">
    <meta property="og:description" content="Мой Telegram-канал и TikTok">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1a1a2e;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Декоративные шары */
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .bubble:nth-child(1) {
            width: 200px;
            height: 200px;
            background: white;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 150px;
            height: 150px;
            background: white;
            bottom: -75px;
            right: -75px;
            animation-delay: 2s;
        }

        .bubble:nth-child(3) {
            width: 100px;
            height: 100px;
            background: white;
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            33% { transform: translateY(-30px) translateX(20px); }
            66% { transform: translateY(30px) translateX(-20px); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.3);
        }

        /* Градиент фон за аватаром */
        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
        }

        .avatar-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(15px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .avatar-placeholder {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            font-weight: 800;
            color: white;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: transform 0.4s;
        }

        .avatar-placeholder:hover {
            transform: scale(1.08) rotate(5deg);
        }

        .name {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            color: #764ba2;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .bio-text {
            font-size: 16px;
            color: #555;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: white;
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.4s;
        }

        .link-btn:hover::before {
            left: 100%;
        }

        .link-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .link-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .telegram {
            background: linear-gradient(135deg, #2AABEE 0%, #0088cc 100%);
        }

        .tiktok {
            background: linear-gradient(135deg, #00f7ef 0%, #303030 100%);
        }

        .icon {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(102, 126, 234, 0.1);
            font-size: 13px;
            color: #999;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .footer strong {
            color: #667eea;
            font-weight: 600;
        }

        /* Адаптивность */
        @media (max-width: 520px) {
            .profile-card {
                padding: 35px 25px;
            }

            .name {
                font-size: 28px;
            }

            .bio-text {
                font-size: 14px;
            }

            .avatar-placeholder {
                width: 110px;
                height: 110px;
                font-size: 44px;
            }

            .link-btn {
                font-size: 16px;
                padding: 14px 20px;
            }
        }

        @media (max-width: 380px) {
            .profile-card {
                padding: 28px 18px;
            }

            .avatar-placeholder {
                width: 90px;
                height: 90px;
                font-size: 36px;
                margin-bottom: 15px;
            }

            .name {
                font-size: 22px;
            }

            .link-btn {
                font-size: 15px;
                padding: 12px 16px;
                gap: 8px;
            }

            .icon {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <div class="profile-card">
            <!-- АВАТАР -->
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <div class="avatar-placeholder">JM</div>
            </div>

            <!-- ОСНОВНАЯ ИНФОРМАЦИЯ -->
            <div class="title">Creator • Influencer</div>
            <h1 class="name">Jose Mourinho</h1>
            <p class="bio-text">🎬 Добро пожаловать на мой канал! Здесь ты найдешь интересный контент, лайфхаки и развлечения. Подписывайся и не пропусти новые видео!</p>

            <!-- КНОПКИ ССЫЛОК -->
            <div class="links">
                <a class="link-btn telegram" href="https://t.me/+7cLiJdIsAN8yNTIy" target="_blank" rel="noopener">
                    <svg class="icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.2l.92-4.603.003-.005 5.182-4.374z"/>
                    </svg>
                    Telegram-канал

                <a class="link-btn tiktok" href="https://www.tiktok.com/@jose_mourinho108" target="_blank" rel="noopener">
                    <svg class="icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.66 1.94 2.89 2.89 0 0 1 5.66-1.94v-3.4a6.6 6.6 0 0 0-5.66 1.94 6.6 6.6 0 0 0 5.66-1.94V2.4a6.6 6.6 0 0 0 5.66 5.66v-3.2z"/>
                    </svg>
                    TikTok

            </div>

            <!-- ПОДВАЛ -->
            <div class="footer">
                📱 Подпишись: <strong>@Latttykkk</strong>
            </div>
        </div>
    </div>
</body>
</html>
