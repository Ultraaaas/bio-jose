<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Mourinho | Соцсети</title>
    <!-- Мета-теги для соцсетей (превью при отправке ссылки) -->
    <meta property="og:title" content="Jose Mourinho | Соцсети">
    <meta property="og:description" content="Мой Telegram-канал и TikTok">
    <meta property="og:type" content="website">
    <!-- Favicon (иконка вкладки) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e, #0f0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .profile-card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        /* АВАТАР С ИНИЦИАЛАМИ (автоматически) */
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #4f8cf7, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: white;
            box-shadow: 0 0 25px rgba(79, 140, 247, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bio-text {
            font-size: 16px;
            color: #c0c0d0;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            cursor: pointer;
            border: none;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .telegram {
            background: linear-gradient(135deg, #2AABEE, #229ED9);
        }

        .tiktok {
            background: linear-gradient(135deg, #010101, #69C9D0);
        }

        /* SVG-иконки */
        .icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #808090;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <!-- АВАТАР: показывает первые буквы имени (JM), если хотите своё фото, замените этот блок на <img src="..."> -->
        <div class="avatar-placeholder">JM</div>

        <!-- ЗАМЕНИТЕ ИМЯ И ОПИСАНИЕ ПРИ ЖЕЛАНИИ -->
        <h1 class="name">Jose Mourinho</h1>
        <p class="bio-text">Привет! Подписывайся на мой приватный Telegram и TikTok 😎</p>

        <!-- КНОПКИ -->
        <div class="links">

                    <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.10-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
                </svg>
                TikTok

        </div>

        <div class="footer">

    </div>
</body>
</html>
